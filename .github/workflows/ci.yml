name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: App imports and the shipped model loads
        run: python -c "import sys; sys.path.insert(0, 'src'); from model import load_bundle; b = load_bundle('models/emotion_model.joblib'); print(b['metrics']['accuracy'])"
